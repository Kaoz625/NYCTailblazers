# Self-hosted Supabase for LLM-Brains
# Provides: Postgres + pgvector, Auth, Storage, REST API, Realtime
#
# Quick start:
#   cd docker/
#   cp ../.env.supabase.example ../.env.supabase
#   # Edit .env.supabase with your secrets
#   docker compose up -d
#
# Services:
#   Supabase Studio:  http://localhost:3000
#   REST API:         http://localhost:8000
#   Postgres:         localhost:5432
#
# After starting, run the schema migration:
#   python ../src/supabase_sync.py --migrate
#
# Stop:
#   docker compose down
# Remove all data:
#   docker compose down -v

version: "3.8"

services:

  # ─── Core Postgres with pgvector ──────────────────────────────────────────
  db:
    image: supabase/postgres:15.6.1.90
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your-super-secret-password}
      POSTGRES_DB: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kong API Gateway ─────────────────────────────────────────────────────
  kong:
    image: kong:2.8.1
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8443:8443"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
    volumes:
      - ./kong.yml:/var/lib/kong/kong.yml:ro
    depends_on:
      db:
        condition: service_healthy

  # ─── GoTrue Auth ──────────────────────────────────────────────────────────
  auth:
    image: supabase/gotrue:v2.149.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-your-super-secret-password}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-token}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"

  # ─── PostgREST API ────────────────────────────────────────────────────────
  rest:
    image: postgrest/postgrest:v12.0.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-your-super-secret-password}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-token}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  # ─── Realtime ─────────────────────────────────────────────────────────────
  realtime:
    image: supabase/realtime:v2.27.5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD:-your-super-secret-password}
      DB_NAME: postgres
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-token}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-your-super-secret-key-base}

  # ─── Supabase Studio ──────────────────────────────────────────────────────
  studio:
    image: supabase/studio:20240422-5cf8f30
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your-super-secret-password}
      DEFAULT_ORGANIZATION_NAME: LLM-Brains
      DEFAULT_PROJECT_NAME: brain
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      SUPABASE_ANON_KEY: ${ANON_KEY:-your-anon-key}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:-your-service-role-key}

  # ─── Meta (pg_meta) ───────────────────────────────────────────────────────
  meta:
    image: supabase/postgres-meta:v0.80.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-your-super-secret-password}

volumes:
  db_data:
